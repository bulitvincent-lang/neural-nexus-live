name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Build frontend
        run: bun run build

      - name: Inspect frontend output
        shell: bash
        continue-on-error: true
        run: |
          ls -la . || true
          ls -la dist || true
          ls -la .output || true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: 1
        with:
          projectPath: ./src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Neural Orb ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Tauri build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: src-tauri/target/**/build.log

  connector:
    # Ships the browser companion (zip) alongside the installers,
    # so the website download link always resolves.
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Package the browser companion
        run: |
          cd extension
          zip -r ../neural-orb-connector.zip . -x "*.DS_Store"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: neural-orb-connector.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
